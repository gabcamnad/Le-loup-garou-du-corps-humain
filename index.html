<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loup-garou du corps humain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Plan : un village la nuit (encre bleu nuit, lune dorée, rouge sang) qui bascule au jour (ciel pâle).
   Scène de jeu à gauche, grande et lisible au projecteur; registre du village à droite. */
:root{
  --ink:#0e1330;
  --panel:#171f48;
  --panel-2:#212a5c;
  --text:#ede7d0;
  --muted:#a2a7c9;
  --accent:#d23f57;
  --gold:#f0b35a;
  --ok:#3fb07a;
  --bad:#e65c70;
  --line:rgba(237,231,208,.14);
  --line-strong:rgba(237,231,208,.38);
  --cA:#2f6fde;
  --cB:#e07b12;
  --cC:#23955a;
  --cD:#8b4fd6;
  --font-display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
body[data-mood="day"]{
  --ink:#e4ecf3;
  --panel:#ffffff;
  --panel-2:#e9eff6;
  --text:#18203d;
  --muted:#56607f;
  --accent:#b8263f;
  --gold:#a8620a;
  --ok:#1d8452;
  --bad:#c23149;
  --line:rgba(24,32,61,.13);
  --line-strong:rgba(24,32,61,.34);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--font-body);font-size:18px;line-height:1.45;transition:background-color .8s,color .8s}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:1;transition:opacity .8s}
body[data-mood="day"] #sky{opacity:0}
.app{position:relative;min-height:100%;display:flex;flex-direction:column}

header.top{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;padding:14px 24px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.85rem;color:var(--muted);letter-spacing:0;margin-left:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);font-weight:700;font-size:.95rem}
.pill .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.mini{font:inherit;font-size:.9rem;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--text);cursor:pointer}
.mini:hover{background:var(--panel-2)}

main.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:24px;align-items:start}
body.no-panel main.layout{grid-template-columns:minmax(0,1fr)}
body.no-panel #village{display:none}
@media (max-width:980px){main.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){main.layout{padding:16px}}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,40px);min-height:440px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.82rem;color:var(--gold);font-weight:700}
h1.title{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1.02;margin:.15em 0 .35em;text-wrap:balance}
.script{margin:0 0 8px;border-left:5px solid var(--gold);padding:14px 20px;background:var(--panel-2);border-radius:0 12px 12px 0;font-size:clamp(1.15rem,1.8vw,1.45rem);max-width:62ch}
.script .lbl{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;font-weight:700}
.note{color:var(--muted);margin:14px 0 0;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{font:inherit;font-weight:700;font-size:1.12rem;padding:14px 24px;border-radius:12px;border:2px solid var(--accent);cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn.ghost:hover{background:var(--panel-2);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Questions */
.q-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.85rem;color:#10142a;white-space:nowrap}
.t-num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.t-num.out{color:var(--bad)}
.timer{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:12px;max-width:100%}
.timer>i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.q-text{font-size:clamp(1.55rem,2.8vw,2.35rem);font-weight:700;line-height:1.2;margin:20px 0 24px;max-width:38ch;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:16px;align-items:center;text-align:left;font:inherit;font-size:clamp(1.1rem,1.7vw,1.35rem);padding:16px 18px;border-radius:14px;background:var(--panel-2);color:var(--text);border:2px solid var(--line);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt .lt{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--ink);font-weight:700;font-size:1.35rem}
.opt:disabled,.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line)}
.heart{color:#ef7fb0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}
.filebtn:has(+ input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
textarea.drop{outline:3px dashed var(--gold);outline-offset:2px}
.groups{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.groups input[type="text"]{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;flex:1;min-width:160px}
.groups select{flex:1;min-width:160px}
.charmlist{font-size:clamp(1.4rem,2.4vw,2rem);font-weight:700;margin:20px 0 0;max-width:40ch}
.countbox{margin-top:18px;padding:18px 20px;border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:10px;max-width:70ch}
.countbox label{font-weight:700;font-size:1.15rem}
.countbox input{width:110px;font-size:1.6rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.mini.step{font-size:1.4rem;width:48px;height:48px;padding:0}
.countbox .hint{margin:0;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 24%,var(--panel-2))}
.opt .lt[data-l="A"]{background:var(--cA);color:#fff}
.opt .lt[data-l="B"]{background:var(--cB);color:#fff}
.opt .lt[data-l="C"]{background:var(--cC);color:#fff}
.opt .lt[data-l="D"]{background:var(--cD);color:#fff}
.opt .lt[data-l="B"]{border-radius:0;width:54px;height:50px;padding-top:14px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.opt .lt[data-l="C"]{border-radius:6px}
.opt .lt[data-l="D"]{border-radius:0;width:54px;height:54px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.opt.correct::after{content:"Bonne réponse";margin-left:auto;padding-left:10px;font-size:.85rem;font-weight:700;color:var(--ok);white-space:nowrap}
.countdown{font-family:var(--font-display);font-weight:700;font-size:clamp(4rem,12vw,9rem);line-height:1;text-align:center;margin:16px 0 0;color:var(--gold)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--panel-2))}

.feedback{margin-top:20px;padding:16px 20px;border-radius:12px;font-size:1.15rem;max-width:70ch;border:2px solid}
.feedback.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.feedback.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* Choix d'un joueur */
.grid-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
.pl{font:inherit;font-size:1.1rem;font-weight:700;padding:14px 10px;border-radius:12px;background:var(--panel-2);border:2px solid var(--line);color:var(--text);cursor:pointer;overflow-wrap:anywhere}
.pl:hover{border-color:var(--line-strong)}
.pl[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 30%,var(--panel-2))}
.pl .tag{display:block;font-size:.75rem;font-weight:400;color:var(--muted)}

/* Cartes de rôle */
.rolecard{--role:var(--gold);display:flex;gap:26px;align-items:center;padding:26px 30px;border-radius:18px;border:3px solid var(--role);background:color-mix(in srgb,var(--role) 12%,var(--panel-2));max-width:700px;margin-top:20px}
.rolecard svg{width:110px;height:110px;flex:none;color:var(--role)}
.rolecard h2{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,4vw,3.2rem);margin:0;line-height:1;color:var(--role)}
.rolecard p{margin:10px 0 0;font-size:1.15rem}
.rolecard .goal{color:var(--muted);font-size:1rem}
@media (max-width:560px){.rolecard{flex-direction:column;align-items:flex-start}}

.debate{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}
.clock{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4ch}
.clock.out{color:var(--bad)}

/* Panneau du village */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;position:sticky;top:16px}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:1.9rem;margin:0 0 12px;line-height:1}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{background:var(--panel-2);border-radius:10px;padding:8px 6px;text-align:center;font-size:.78rem;color:var(--muted);line-height:1.2}
.count b{display:block;font-size:1.55rem;color:var(--text);font-variant-numeric:tabular-nums;margin-bottom:2px}
.vlist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:4px;max-height:58vh;overflow:auto}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:.98rem}
.vlist li.dead .nm{text-decoration:line-through;color:var(--muted)}
.vtag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line-strong);color:var(--muted)}
.vtag.loup{background:var(--accent);border-color:var(--accent);color:#fff}
.vtag.inno{border-color:var(--ok);color:var(--ok)}

/* Réglages */
.setup-intro{max-width:70ch;font-size:1.1rem;margin:0 0 6px}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:22px}
.box{background:var(--panel-2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:1.15rem}
.box .hint{margin:0;color:var(--muted);font-size:.92rem}
textarea,input[type="number"],select{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px}
textarea{width:100%;min-height:210px;resize:vertical;line-height:1.35}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type="number"]{width:90px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);font-size:.86rem}
.sys-list{display:grid;grid-template-columns:1fr;gap:8px}
.sys-list .check{align-items:center}
.sys-n{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.howto{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-weight:700;margin:16px 0 0}
details summary{cursor:pointer;font-weight:700}
code{background:var(--ink);padding:2px 6px;border-radius:6px;font-size:.88em}

/* Fin */
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px}
.statrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:.98rem}
.bar{height:10px;background:var(--ink);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.statrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.allroles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.allroles div{display:flex;justify-content:space-between;gap:6px;background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:.95rem}

/* Fenêtre superposée */
.overlay{position:fixed;inset:0;background:rgba(5,8,24,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:10;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);color:var(--text);border:1px solid var(--line-strong);border-radius:18px;padding:28px;max-width:640px;width:100%}
.modal h2{font-family:var(--font-display);font-size:2.2rem;margin:0 0 10px;line-height:1}
.modal textarea{min-height:260px;font-size:.95rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mood="night" class="no-panel">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <p class="brand">Loup-garou du corps humain<small>Village de Sainte-Cellule</small></p>
    <span class="pill" id="phase"><span class="dot"></span><span id="phaseTxt">Préparation</span></span>
    <div class="top-actions">
      <button type="button" class="mini" id="fsBtn">Plein écran</button>
      <button type="button" class="mini" id="newBtn">Nouvelle partie</button>
    </div>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="panel" id="village" aria-label="Le village"></aside>
  </main>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>

<script>
/* ---------- Banque de questions (Secondaire 3, L'être humain) ---------- */
const SYS = {
  dig:{nom:"Système digestif", c:"#eaa24c"},
  res:{nom:"Système respiratoire", c:"#71c6e2"},
  cir:{nom:"Système circulatoire", c:"#ee7482"},
  lym:{nom:"Système lymphatique et immunité", c:"#9fdc7e"},
  exc:{nom:"Système excréteur", c:"#e9d460"},
  ner:{nom:"Système nerveux et sens", c:"#b993f2"},
  mus:{nom:"Système musculosquelettique", c:"#f2a0b9"},
  rep:{nom:"Système reproducteur", c:"#7fd3c3"},
  perso:{nom:"Mes questions", c:"#c9cbd6"}
};
const RAW = [
["dig","Dans quelle partie du tube digestif commence la digestion chimique de l'amidon ?","La bouche","L'estomac","L'intestin grêle","Le gros intestin","La salive contient de l'amylase, une enzyme qui commence à transformer l'amidon dès la bouche."],
["dig","Dans quel organe se fait la plus grande partie de l'absorption des nutriments ?","L'intestin grêle","L'estomac","Le gros intestin","L'œsophage","Les villosités de l'intestin grêle offrent une immense surface d'échange avec le sang."],
["dig","Quel organe produit la bile ?","Le foie","La vésicule biliaire","Le pancréas","L'estomac","Le foie produit la bile. La vésicule biliaire ne fait que l'entreposer avant de la libérer dans le duodénum."],
["dig","Quel est le rôle principal du gros intestin ?","Absorber l'eau et former les selles","Digérer les protéines","Produire la bile","Absorber la majorité des nutriments","Quand les résidus arrivent au gros intestin, la plupart des nutriments ont déjà été absorbés."],
["dig","Comment s'appellent les contractions qui font avancer les aliments dans le tube digestif ?","Le péristaltisme","La mastication","L'absorption","La déglutition","Les muscles lisses du tube digestif se contractent en vagues. La déglutition, c'est l'action d'avaler."],
["dig","La mastication est un exemple de…","Transformation mécanique des aliments","Transformation chimique des aliments","Absorption des nutriments","Élimination des déchets","Les dents coupent et broient les aliments sans changer leur nature chimique."],
["dig","Quel conduit amène les aliments du pharynx jusqu'à l'estomac ?","L'œsophage","La trachée","Le duodénum","Le larynx","La trachée, elle, conduit l'air vers les poumons."],
["dig","En quoi les protéines sont-elles transformées lors de la digestion ?","En acides aminés","En glucose","En acides gras et glycérol","En minéraux","Le glucose provient des glucides; les acides gras et le glycérol proviennent des lipides."],
["dig","Quelle glande déverse dans le duodénum un suc qui agit sur les glucides, les lipides et les protéines ?","Le pancréas","Les glandes salivaires","Les glandes gastriques","La vésicule biliaire","Le suc pancréatique contient plusieurs enzymes qui agissent sur les trois grands types de nutriments."],
["dig","Quel acide fait partie du suc gastrique ?","L'acide chlorhydrique","L'acide citrique","L'acide lactique","L'acide acétique","L'acide chlorhydrique de l'estomac aide à digérer les protéines et détruit plusieurs microbes."],
["dig","Quelle partie du corps est commune au système digestif et au système respiratoire ?","Le pharynx","Le larynx","L'œsophage","La trachée","L'air et les aliments passent tous deux par le pharynx. L'épiglotte dirige ensuite les aliments vers l'œsophage."],

["res","Où se font les échanges gazeux entre l'air et le sang ?","Dans les alvéoles pulmonaires","Dans la trachée","Dans les bronches","Dans le larynx","Les alvéoles ont des parois très minces entourées de capillaires sanguins."],
["res","Dans les poumons, quel gaz passe des alvéoles vers le sang ?","Le dioxygène (O₂)","Le dioxyde de carbone (CO₂)","Le diazote (N₂)","La vapeur d'eau","Le CO₂ fait le trajet inverse : du sang vers les alvéoles, puis il est expiré."],
["res","Quel muscle joue le rôle principal dans la respiration ?","Le diaphragme","Le muscle cardiaque","Les abdominaux","Le biceps","Le diaphragme est un muscle en forme de dôme situé sous les poumons."],
["res","Pendant l'inspiration, que fait le diaphragme ?","Il se contracte et s'abaisse","Il se relâche et remonte","Il se contracte et remonte","Il ne bouge pas","En s'abaissant, il augmente le volume de la cage thoracique. La pression baisse et l'air entre."],
["res","Quelle structure empêche les aliments d'entrer dans la trachée quand on avale ?","L'épiglotte","La luette","Le larynx","Les cordes vocales","L'épiglotte se rabat sur le larynx comme un couvercle au moment d'avaler."],
["res","Quel est le bon ordre du trajet de l'air inspiré ?","Fosses nasales → pharynx → larynx → trachée → bronches","Fosses nasales → larynx → pharynx → bronches → trachée","Pharynx → fosses nasales → trachée → larynx → bronches","Fosses nasales → trachée → pharynx → larynx → bronches","Après les bronches viennent les bronchioles, puis les alvéoles."],
["res","Dans quelle structure se trouvent les cordes vocales ?","Le larynx","Le pharynx","La trachée","Les bronches","L'air expiré fait vibrer les cordes vocales du larynx : c'est ce qui produit la voix."],
["res","À quoi servent le mucus et les cils des voies respiratoires ?","À retenir et évacuer les poussières et les microbes","À réchauffer le sang","À produire du dioxygène","À faire vibrer les cordes vocales","Les cils poussent le mucus et ce qu'il a capturé vers le pharynx, loin des poumons."],
["res","Pourquoi vaut-il mieux respirer par le nez que par la bouche ?","Le nez filtre, réchauffe et humidifie l'air","Le nez absorbe directement le dioxygène","Le nez retire le CO₂ de l'air","L'air passe plus vite par le nez","Les poils, le mucus et les vaisseaux sanguins des fosses nasales préparent l'air avant qu'il n'atteigne les poumons."],
["res","Pendant l'expiration, qu'arrive-t-il au volume de la cage thoracique ?","Il diminue, ce qui pousse l'air vers l'extérieur","Il augmente, ce qui pousse l'air vers l'extérieur","Il reste le même","Il augmente, ce qui fait entrer l'air","Le volume diminue, la pression dans les poumons augmente et l'air sort."],

["cir","Combien de cavités le cœur humain possède-t-il ?","4","2","3","6","Deux oreillettes en haut et deux ventricules en bas."],

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const DEFAULTS = {wolves:"auto", voyante:true, medecin:true, cupidon:true, flutiste:true, chasseur:true, ancien:false, petitefille:false, injections:1, qVictim:true, qVillage:true, qSeer:true, answerMode:"card", timer:30, systems:["dig","res","cir","lym","exc","ner","mus","rep","perso"]};

function parseCustom(text){
  const out = [], bad = [];
  String(text || "").split("\n").forEach((l, i) => {
    l = l.trim(); if (!l) return;
    const f = l.split("|").map(x => x.trim());
    if (f.length < 5 || f.slice(0, 5).some(x => !x)) { bad.push(i + 1); return; }
    out.push({s:"perso", q:f[0], a:f[1], w:[f[2], f[3], f[4]], e:f[5] || ""});
  });
  return {out, bad};
}
function poolFor(systems){ return QBANK.concat(customQs).filter(q => systems.includes(q.s)); }

const sky = $("#sky");
function drawSky(){
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  sky.width = w * dpr; sky.height = h * dpr;
  const c = sky.getContext && sky.getContext("2d"); if (!c) return; c.scale(dpr, dpr);
  const g = c.createRadialGradient(w * .85, h * .08, 0, w * .85, h * .08, Math.max(w, h) * .7);
  g.addColorStop(0, "rgba(240,179,90,.10)"); g.addColorStop(1, "rgba(14,19,48,0)");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < Math.round(w * h / 9000); i++) {
    c.globalAlpha = .25 + rnd() * .6; c.fillStyle = "#ede7d0";
    c.beginPath(); c.arc(rnd() * w, rnd() * h, rnd() * 1.3 + .2, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
}
drawSky(); addEventListener("resize", drawSky);

function renderVillage(){
  const el = $("#village");
  if (!S || S.phase === "setup") { document.body.classList.add("no-panel"); el.innerHTML = ""; return; }
  document.body.classList.remove("no-panel");
  const alive = S.players.filter(p => p.alive).length;
  const ok = Object.values(S.stats).reduce((a, s) => a + s.ok, 0);
  const n = Object.values(S.stats).reduce((a, s) => a + s.n, 0);
  const end = S.phase === "end";
  el.innerHTML = `<h2>Le village</h2>
    <div class="counts">
      <div class="count"><b>${alive}</b>en vie</div>
      <div class="count"><b>${S.nWolves}</b>loups au départ</div>
      <div class="count"><b>${ok}/${n}</b>bonnes réponses</div>
    </div>
    <ul class="vlist">${S.players.map(p => {
      let tag = "";
      if (!p.alive || end) tag = `<span class="vtag ${p.role === "loup" ? "loup" : ""}">${ROLES[p.role].nom}</span>`;
      else if (p.cleared) tag = `<span class="vtag inno">Innocent·e</span>`;
      return `<li class="${p.alive ? "" : "dead"}"><span class="nm">${esc(p.name)}</span>${tag}</li>`;
    }).join("")}</ul>`;
}

function record(s, ok){ const r = S.stats[s] || (S.stats[s] = {ok:0, n:0}); r.n++; if (ok) r.ok++; }
/* Questions déjà posées, gardées d'une partie à l'autre : on pige d'abord parmi celles jamais posées */
let usedQ = new Set(store.get("lg-used", []));
function freshCount(systems){ return poolFor(systems).filter(q => !usedQ.has(q.q)).length; }
function drawQ(){
  if (!S.deck.length) {
    const pool = poolFor(S.systems);
    let fresh = pool.filter(q => !usedQ.has(q.q));
    if (!fresh.length) { pool.forEach(q => usedQ.delete(q.q)); fresh = pool; }
    S.deck = shuffle(fresh);
  }
  const q = S.deck.pop();
  usedQ.add(q.q); store.set("lg-used", [...usedQ]);
  return q;
}
const isAlive = role => S.players.some(p => p.alive && p.role === role);
function checkWin(){
  const alive = S.players.filter(p => p.alive);
  const fl = alive.find(p => p.role === "flutiste");
  if (fl && alive.every(p => p === fl || S.charmed.includes(p.id))) return "flutiste";
  if (S.lovers && alive.length === 2 && alive.every(p => S.lovers.includes(p.id)) &&
      (alive[0].role === "loup") !== (alive[1].role === "loup")) return "amoureux";
  const w = alive.filter(p => p.role === "loup").length;
  if (w === 0) return fl ? null : "village";
  if (w >= alive.length - w) return "loups";
  return null;
}

function newGame(names){
  const n = names.length;
  const nW = settings.wolves === "auto" ? autoWolves(n) : +settings.wolves;
  let roles = Array(nW).fill("loup");
  SPECIALS.forEach(r => { if (settings[r]) roles.push(r); });
  while (roles.length < n) roles.push("villageois");
  roles = shuffle(roles);
  const inj = settings.medecin ? +settings.injections : 0;
  S = {phase:"deal", names, players:names.map((name, i) => ({id:i, name, role:roles[i], alive:true, cleared:false})),
       round:1, lastProtected:null, protectedTonight:null, victim:null, injected:null, injections:inj, injectionsStart:inj,
       lovers:null, charmed:[], ancienHit:false, deck:[], stats:{}, nWolves:nW, systems:settings.systems.slice()};
}

/* ---------- Composants de jeu ---------- */
/* Modes : "click"  = la voyante montre ses doigts, le meneur clique sa réponse (nuit, yeux fermés)
           "judge"  = un joueur répond en secret au meneur, qui indique seulement bon / mauvais
           "count"  = tout le village répond sur billet, le meneur entre le nombre de bonnes réponses */
function askQuestion(o){
  let q = drawQ();
  let mode = o.mode || "judge";
  const labels = ["A","B","C","D"];
  let opts = shuffle([q.a].concat(q.w));
  const show = () => {
    const sys = SYS[q.s];
    const optHtml = opts.map((t, i) => mode === "click"
      ? `<button type="button" class="opt" data-act="pick" data-arg="${i}"><span class="lt" data-l="${labels[i]}">${labels[i]}</span><span>${esc(t)}</span></button>`
      : `<div class="opt static"><span class="lt" data-l="${labels[i]}">${labels[i]}</span><span>${esc(t)}</span></div>`).join("");
    const body = `<div class="q-head"><span class="chip" style="background:${sys.c}">${sys.nom}</span>${settings.timer ? `<span class="t-num" id="tnum">${settings.timer} s</span>` : ""}</div>
      ${settings.timer ? `<div class="timer"><i id="tbar" style="width:100%"></i></div>` : ""}
      <p class="q-text">${esc(q.q)}</p>
      <div class="opts">${optHtml}</div>
      <div id="fb"></div>`;
    const reveal = (cls, head) => {
      clearTimers();
      stage.querySelectorAll(".opt").forEach((b, j) => {
        if (b.tagName === "BUTTON") b.disabled = true;
        if (opts[j] === q.a) b.classList.add("correct");
      });
      $("#fb").innerHTML = `<div class="feedback ${cls}"><strong>${head}</strong> ${esc(q.e || "")}</div>`;
    };
    const finish = (label, fn) => {
      const act = stage.querySelector(".actions");
      act.innerHTML = btn("cont", label);
      handlers = {cont: fn};
      act.querySelector("button").focus();
      renderVillage();
    };
    const answerClick = i => {
      const ok = i >= 0 && opts[i] === q.a;
      record(q.s, ok);
      reveal(ok ? "ok" : "bad", ok ? "Bonne réponse !" : (i < 0 ? "Pas de réponse." : "Mauvaise réponse."));
      if (!ok && i >= 0) stage.querySelectorAll(".opt")[i].classList.add("wrong");
      finish(o.continueLabel || "Continuer", () => o.onDone(ok));
    };
    const judge = ok => {
      record(q.s, ok);
      reveal(ok ? "ok" : "bad", ok ? "Bonne réponse !" : "Mauvaise réponse.");
      finish(o.continueLabel || "Continuer", () => o.onDone(ok));
    };
    const countStep = () => {
      const alive = S.players.filter(p => p.alive).length;
      const need = Math.floor(alive / 2) + 1;
      const L = labels[opts.indexOf(q.a)];
      reveal("ok", `Bonne réponse : ${L}. Comptez les fiches ${L} levées.`);
      $("#fb").insertAdjacentHTML("beforeend", `<div class="countbox">
        <label for="cnt">Combien de fiches montrent la bonne réponse ?</label>
        <div class="row"><button type="button" class="mini step" data-act="minus" aria-label="Retirer un">−</button>
          <input type="number" id="cnt" min="0" max="${alive}" value="0" inputmode="numeric">
          <button type="button" class="mini step" data-act="plus" aria-label="Ajouter un">+</button>
          <span>sur ${alive} joueur${alive > 1 ? "s" : ""} en vie</span></div>
        <p class="hint">Il faut au moins ${need} bonne${need > 1 ? "s" : ""} réponse${need > 1 ? "s" : ""} pour obtenir l'indice du laboratoire.</p></div>`);
      const inp = $("#cnt");
      const val = () => Math.min(alive, Math.max(0, parseInt(inp.value, 10) || 0));
      finish(o.continueLabel || "Voir le résultat", () => {
        const c = val();
        const r = S.stats[q.s] || (S.stats[q.s] = {ok:0, n:0});
        r.ok += c; r.n += alive;
        o.onDone(c >= need, c, alive);
      });
      handlers.minus = () => { inp.value = Math.max(0, val() - 1); };
      handlers.plus = () => { inp.value = Math.min(alive, val() + 1); };
      inp.focus(); inp.select();
    };
    const sw = o.switchable ? btn("switch", mode === "click" ? "Répondre plutôt avec la fiche" : "Répondre plutôt à voix haute", "ghost") : "";
    const acts = {
      click: btn("none", "Pas de réponse", "ghost") + sw + btn("swap", "Changer de question", "ghost"),
      judge: btn("good", "Bonne réponse") + btn("bad", "Mauvaise réponse ou aucune", "ghost") + sw + btn("swap", "Changer de question", "ghost"),
      count: btn("ready", "3, 2, 1… fiches !") + btn("collect", "Fiches levées : afficher la réponse", "ghost") + btn("swap", "Changer de question", "ghost")
    }[mode];
    const script = o.scripts ? o.scripts[mode] : o.script;
    render(scr({kicker:o.kicker, title:o.title, script, body, actions:acts}), {
      pick: i => answerClick(+i), none: () => answerClick(-1),
      good: () => judge(true), bad: () => judge(false),
      collect: countStep,
      ready: (a, b) => {
        clearTimers(); b.disabled = true;
        const fb = $("#fb"); let n = 3;
        fb.innerHTML = `<p class="countdown" aria-live="assertive">3</p>`;
        const iv = setInterval(() => {
          n--;
          const el = fb.querySelector(".countdown");
          if (!el) return clearInterval(iv);
          if (n > 0) el.textContent = n; else { el.textContent = "Fiches !"; clearInterval(iv); }
        }, 900);
        timers.push(iv);
      },
      swap: () => { q = drawQ(); opts = shuffle([q.a].concat(q.w)); show(); },
      switch: () => { mode = mode === "click" ? "judge" : "click"; show(); }
    });
    if (settings.timer) {
      let left = settings.timer;
      const iv = setInterval(() => {
        left--;
        const bar = $("#tbar"), num = $("#tnum");
        if (!bar) return clearInterval(iv);
        bar.style.width = Math.max(0, left / settings.timer * 100) + "%";
        num.textContent = left > 0 ? left + " s" : "Temps écoulé";
        if (left <= 0) { num.classList.add("out"); clearInterval(iv); }
      }, 1000);
      timers.push(iv);
    }
  };
  show();
}

function pickPlayer(o){
  let sel = null;
  const list = S.players.filter(p => p.alive && (!o.filter || o.filter(p)));
  const body = (o.note ? `<p class="note">${o.note}</p>` : "") +
    `<div class="grid-players">${list.map(p => `<button type="button" class="pl" data-act="sel" data-arg="${p.id}" aria-pressed="false">${esc(p.name)}${p.cleared ? '<span class="tag">innocent·e</span>' : ""}</button>`).join("")}</div>`;
  render(scr({kicker:o.kicker, title:o.title, script:o.script, body,
    actions: btn("ok", o.confirmLabel || "Confirmer") + (o.allowNone ? btn("nonep", o.noneLabel, "ghost") : "")}), {
    sel: id => { sel = +id; stage.querySelectorAll(".pl").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.arg === id))); okBtn.disabled = false; },
    ok: () => { if (sel !== null) o.onConfirm(S.players[sel]); },
    nonep: () => o.onNone()
  });
  const okBtn = stage.querySelector('[data-act="ok"]');
  okBtn.disabled = true;
}

/* Choisir plusieurs joueurs (Cupidon, joueur de flûte) */
function pickMany(o){
  const sel = [];
  const list = S.players.filter(p => p.alive && (!o.filter || o.filter(p)));
  const need = Math.min(o.count, list.length);
  if (!need) return o.onConfirm([]);
  const body = `<p class="note">Choisissez ${need} joueur${need > 1 ? "s" : ""}.</p><div class="grid-players">${list.map(p => `<button type="button" class="pl" data-act="tog" data-arg="${p.id}" aria-pressed="false">${esc(p.name)}</button>`).join("")}</div>`;
  render(scr({kicker:o.kicker, title:o.title, script:o.script, body, actions:btn("ok", o.confirmLabel || "Confirmer")}), {
    tog: id => {
      id = +id; const i = sel.indexOf(id);
      if (i >= 0) sel.splice(i, 1); else { if (sel.length >= need) sel.shift(); sel.push(id); }
      stage.querySelectorAll(".pl").forEach(b => b.setAttribute("aria-pressed", String(sel.includes(+b.dataset.arg))));
      okBtn.disabled = sel.length !== need;
    },
    ok: () => { if (sel.length === need) o.onConfirm(sel.map(i => S.players[i])); }
  });
  const okBtn = stage.querySelector('[data-act="ok"]');
  okBtn.disabled = true;
}
function simple(kicker, title, script, label, next, body = ""){
  render(scr({kicker, title, script, body, actions:btn("go", label)}), {go:next});
}

/* ---------- Distribution ---------- */
function deal(i = 0){

/* ---------- Jour ---------- */
function dawn(){
  S.phase = "day"; setMood("day", `Jour ${S.round}`);
  const k = `Jour ${S.round}`;
  const v = S.victim !== null ? S.players[S.victim] : null;
  const inj = S.injected !== null ? S.players[S.injected] : null;
  const intro = "Le soleil se lève sur Sainte-Cellule. Tout le monde ouvre les yeux.";
  let saved = false;
  if (v && S.victim === S.protectedTonight) saved = true;
  else if (v && v.role === "ancien" && !S.ancienHit) { S.ancienHit = true; saved = true; }
  /* Morts de la nuit : la victime des loups (si elle n'a pas survécu), puis la cible de l'injection */
  const finish = (wolfKill, line) => {
    const q = [];
    if (wolfKill) q.push({p:v, line});
    if (inj && inj.alive && !(wolfKill && inj === v)) q.push({p:inj, line:"Une mystérieuse injection a fait son effet pendant la nuit."});
    if (!q.length) return afterDawn();
    killChain(q, k, afterDawn);
  };
  if (!v || saved) {
    const msg = v ? "Les loups ont attaqué cette nuit, mais leur victime a survécu." : "Les loups n'ont attaqué personne cette nuit.";
    return simple(k, inj ? "Une nuit agitée…" : "Personne n'a été dévoré", `${intro} ${msg}`, "Continuer", () => finish(false));
  }
  if (!settings.qVictim) return finish(true, `${intro} Les loups-garous ont attaqué pendant la nuit.`);
  simple(k, `Les loups ont attaqué ${esc(v.name)}`,
    `${intro} Cette nuit, les loups-garous ont attaqué ${esc(v.name)}. Une bonne réponse peut encore lui sauver la vie !`,
    `Question de survie pour ${esc(v.name)}`, () => askQuestion({...solo(v), kicker:k, title:`Dernière chance pour ${esc(v.name)}`,
      onDone: ok => ok
        ? simple(k, `${esc(v.name)} survit !`, "Son système immunitaire a repoussé l'attaque. Les loups devront réessayer.", "Continuer", () => finish(false))
        : finish(true, "Les loups-garous ont eu le dessus.")}));
}
/* Question individuelle : à voix haute (le meneur clique la réponse dite ou pointée) ou par écrit (montrée au meneur seulement) */
function solo(p){
  const n = esc(p.name);
  return {mode: settings.answerMode === "voice" ? "click" : "judge", switchable:true, scripts:{
    click:`${n} répond à voix haute ou pointe sa réponse au tableau. Le reste du village garde le silence.`,
    judge:`${n} choisit sa fiche (A, B, C ou D) et la montre seulement au meneur, sans la faire voir aux autres. Le reste du village garde le silence.`
  }};
}
/* Élimine les joueurs un à un : un amoureux entraîne l'autre, le chasseur tire avant que la file continue */
function killChain(queue, k, next){
  const item = queue.shift();
  if (!item) { const w = checkWin(); return w ? endGame(w) : next(); }
  const p = item.p;
  if (!p.alive) return killChain(queue, k, next);
  p.alive = false;
  let note = "";
  if (LOVE(p.id)) {
    const o = partnerOf(p.id);
    note = `<p class="note"><span class="heart">♥</span> ${esc(p.name)} était amoureux·se de ${esc(o.name)}.</p>`;
    if (o.alive) queue.push({p:o, line:`Le cœur brisé, ${esc(o.name)} ne peut survivre à la mort de ${esc(p.name)}.`});
  }
  render(scr({kicker:k, title:`${esc(p.name)} est éliminé·e`,
    script:`${item.line} ${esc(p.name)} ne peut plus parler jusqu'à la fin de la partie. Son rôle était…`,
    body:roleCard(p.role) + note, actions:btn("go", "Continuer")}),
    {go: () => p.role === "chasseur" ? hunterShot(p, k, queue, () => killChain(queue, k, next)) : killChain(queue, k, next)});
}
function hunterShot(h, k, queue, cont){
  const n = esc(h.name);
  if (!S.players.some(p => p.alive)) return cont();
  const shoot = () => pickPlayer({kicker:k, title:"Le chasseur tire sa dernière balle",
    script:`${n}, pointe la personne que tu emportes avec toi.`, confirmLabel:"Tirer",
    allowNone:true, noneLabel:"Ne pas tirer", onNone:cont,
    onConfirm: t => { queue.unshift({p:t, line:`${n}, le chasseur, a tiré sur ${esc(t.name)}.`}); cont(); }});
  if (!settings.qSeer) return shoot();
  simple(k, "Le chasseur saisit son fusil", `${n} a encore une balle. Une bonne réponse lui permet de tirer.`, "Afficher la question",
    () => askQuestion({...solo(h), kicker:k, title:`Dernier tir de ${n}`,
      onDone: ok => ok ? shoot() : simple(k, "Le fusil s'enraye !", "Mauvaise réponse : le coup ne part pas.", "Continuer", cont)}));
}
function eliminate(p, next, k, line){ killChain([{p, line}], k, next); }

/* ---------- Import de fichiers (Excel, CSV, texte) ---------- */
let xlsxP = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxP) xlsxP = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => res(window.XLSX);
    sc.onerror = () => { xlsxP = null; rej(new Error("xlsx")); };
    document.head.appendChild(sc);
  });
  return xlsxP;
}
function splitCSV(line, d){
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { out.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
/* Lit un fichier et renvoie un tableau de lignes, chaque ligne étant un tableau de cellules */
async function readTable(file){
  const name = file.name.toLowerCase();
  if (/\.(xlsx|xls|ods)$/.test(name)) {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""}).map(r => r.map(c => String(c).trim()));
  }
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", {fatal:true}).decode(buf); }
  catch (e) { text = new TextDecoder("windows-1252").decode(buf); }   /* CSV enregistré par Excel sous Windows */
  text = text.replace(/^﻿/, "");
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const first = lines[0] || "";
  const delim = /\.txt$/.test(name) && !/[;\t|]/.test(text) ? null
    : [";", "\t", "|", ","].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0];
  return lines.map(l => delim && delim[1] > 1 ? splitCSV(l, delim[0]) : [l.trim()]);
}
const normTxt = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
/* Noms d'élèves : reconnaît les colonnes « Prénom » et « Nom »; sinon prend les cellules de texte de chaque ligne */
function namesFromRows(rows){
  const isHead = c => /^(prenom|nom|nom de famille|nom complet|eleve|nom de l.eleve|nom, prenom|fiche)\b/.test(normTxt(c));
  let hi = rows.slice(0, 5).findIndex(r => r.some(isHead));
  const out = [];
  if (hi >= 0) {
    const h = rows[hi].map(normTxt);
    const iP = h.findIndex(c => /^prenom/.test(c));
    const iN = h.findIndex(c => /^(nom|nom de famille|nom complet|eleve|nom de l.eleve)$/.test(c));
    rows.slice(hi + 1).forEach(r => {
      const v = [iP >= 0 ? r[iP] : "", iN >= 0 ? r[iN] : ""].filter(Boolean).join(" ").trim()
        || (r.find(c => c && !/^[\d\s.,:/-]+$/.test(c)) || "");
      if (v) out.push(v);
    });
  } else {
    rows.forEach(r => {
      const cells = r.filter(c => c && !/^[\d\s.,:/-]+$/.test(c)).slice(0, 2);
      if (cells.length) out.push(cells.join(" "));
    });
  }
  return out;
}
/* Questions : Question | Bonne réponse | Mauvaise 1 | Mauvaise 2 | Mauvaise 3 | Explication */
function questionsFromRows(rows){
  const out = [];
  rows.forEach((r, i) => {
    const c = r.map(x => String(x).replace(/\|/g, "/").trim());
    if (i === 0 && /question/.test(normTxt(c[0] || ""))) return;   /* ligne d'en-tête */
    if (c.length >= 5 && c.slice(0, 5).every(Boolean)) out.push(c.slice(0, 6).filter((x, j) => j < 5 || x).join(" | "));
  });
  return out;
}
const IMPORT_FAIL = "Impossible de lire ce fichier. Enregistrez-le en CSV ou copiez-collez la colonne dans la boîte.";

/* ---------- Réglages ---------- */
function readNames(){
  const seen = {};
  return namesText.split("\n").map(s => s.trim()).filter(Boolean).map(n => {
    seen[n] = (seen[n] || 0) + 1;
    return seen[n] > 1 ? `${n} (${seen[n]})` : n;
  });
}

      </div>
      <textarea id="names" placeholder="Léa&#10;Mathis&#10;Florence&#10;Noah&#10;…">${esc(namesText)}</textarea>
      <div class="row"><span id="ncount"><b>${n}</b> joueur${n > 1 ? "s" : ""}</span>
        <span style="margin-left:auto" class="row"><label for="numN">Ou des numéros :</label><input type="number" id="numN" min="5" max="60" value="${n || 28}"><button type="button" class="mini" id="numBtn">Remplir</button></span></div>
      <div class="groups">
        <div class="row"><label for="groupSel">Mes groupes</label><select id="groupSel"></select>
          <button type="button" class="mini" id="groupDel">Supprimer</button></div>
        <div class="row"><input type="text" id="groupName" placeholder="Nom du groupe (ex. 302)" maxlength="40">
          <button type="button" class="mini" id="groupSave">Enregistrer cette liste</button></div>
        <p class="hint" id="groupInfo" aria-live="polite">Enregistrez chaque liste une fois, puis choisissez le groupe avant de jouer.</p>
      </div>
    </div>
    <div class="box">
      <h3>2. Les rôles</h3>
      <div class="row"><label for="wolves">Nombre de loups-garous</label><select id="wolves">${wolfOpts}</select><span class="hint" id="wolfHint"></span></div>
      ${SPECIALS.map(r => `<label class="check"><input type="checkbox" class="role" id="${r}" ${settings[r] ? "checked" : ""}><span>${ROLES[r].nom}<small>${ROLES[r].short}</small></span></label>`).join("")}
      <div class="row"><label for="injections">Injections mortelles du médecin</label><select id="injections">
        <option value="0">Aucune</option><option value="1">1 par partie</option><option value="2">2 par partie</option><option value="3">3 par partie</option></select></div>
      <p class="hint" id="roleHint"></p>
      <h3>3. Les questions décident…</h3>
      <label class="check"><input type="checkbox" id="qVictim" ${settings.qVictim ? "checked" : ""}><span>La survie de la victime des loups<small>Bonne réponse : elle survit à l'attaque.</small></span></label>
      <label class="check"><input type="checkbox" id="qVillage" ${settings.qVillage ? "checked" : ""}><span>Un indice pour tout le village<small>Chacun montre sa fiche au meneur seulement; si la majorité a raison, un innocent est révélé.</small></span></label>
      <label class="check"><input type="checkbox" id="qSeer" ${settings.qSeer ? "checked" : ""}><span>Les pouvoirs spéciaux<small>La voyante, Cupidon et le joueur de flûte doivent bien répondre pour utiliser leur pouvoir : ils montrent leur fiche au meneur, les yeux des autres fermés. Le chasseur doit bien répondre pour tirer.</small></span></label>
      <div class="row"><label for="answerMode">Réponse de la victime (et du chasseur)</label><select id="answerMode">
        <option value="card">Avec les fiches ABCD, montrées au meneur seulement</option><option value="voice">À voix haute ou en pointant</option></select></div>
      <p class="hint">Vous pourrez aussi changer de façon sur l'écran de chaque question.</p>
      <div class="row"><label for="timer">Temps par question</label><select id="timer">
        <option value="0">Aucune minuterie</option><option value="20">20 secondes</option><option value="30">30 secondes</option><option value="45">45 secondes</option><option value="60">60 secondes</option></select></div>
    </div>
    <div class="box">
      <h3>4. Les systèmes au programme</h3>
      <div class="sys-list">${sysBoxes}</div>
      <div class="row"><span class="hint" id="freshInfo"></span><button type="button" class="mini" id="resetUsed">Remettre toutes les questions à neuf</button></div>
      <details><summary>Ajouter mes propres questions</summary>
        <p class="hint">Une question par ligne, champs séparés par une barre verticale. La bonne réponse vient en premier; l'ordre est mélangé au moment du jeu.</p>
        <p class="hint"><code>Question | Bonne réponse | Mauvaise 1 | Mauvaise 2 | Mauvaise 3 | Explication (facultatif)</code></p>
        <textarea id="custom" style="min-height:140px" placeholder="Quel organe entrepose l'urine ? | La vessie | Le rein | L'uretère | Le foie | La vessie se vide par l'urètre.">${esc(customText)}</textarea>
        <div class="row">
          <label class="mini filebtn" for="customFile">Importer un fichier de questions</label>
          <input type="file" id="customFile" class="sr-only" accept=".xlsx,.xls,.ods,.csv,.txt">
          <span class="hint">Excel ou CSV : une question par ligne, dans les colonnes Question, Bonne réponse, Mauvaise 1, Mauvaise 2, Mauvaise 3, Explication.</span>
        </div>
        <p class="hint" id="customInfo"></p>
      </details>
    </div>
  </div>
  <div class="box" style="margin-top:20px">
    <h3>Déroulement d'un tour</h3>
    <ol class="howto">
      <li><b>Nuit :</b> tout le monde ferme les yeux. Cupidon répond à une question pour unir deux amoureux (s'il se trompe, il réessaie la nuit suivante). Ensuite, chaque nuit : le médecin protège quelqu'un (et peut utiliser une injection mortelle), la voyante répond à une question pour sonder un joueur, les loups pointent leur victime, puis le joueur de flûte charme deux joueurs.</li>
      <li><b>Lever du jour :</b> la victime répond à une question de survie, avec sa fiche montrée au meneur seulement (l'écran indique si c'est bon sans révéler son choix) ou à voix haute. Mauvaise réponse : elle est éliminée et son rôle est révélé.</li>
      <li><b>Laboratoire :</b> au signal « 3, 2, 1… fiches ! », tous les joueurs en vie montrent leur fiche au meneur. Le meneur compte les fiches de la bonne couleur; si la majorité a raison, un innocent est révélé. Les loups ont intérêt à répondre faux… sans que personne le sache.</li>
      <li><b>Débat et vote :</b> le village vote pour éliminer quelqu'un. Pas de seconde chance : la personne est éliminée et son rôle est révélé.</li>
    </ol>
    <p class="hint">Matériel : un jeu de fiches A, B, C, D par élève. Chaque lettre a sa couleur et sa forme (A rond bleu, B triangle orange, C carré vert, D losange violet), les mêmes qu'à l'écran, pour compter rapidement.</p>
  </div>
  <p class="err" id="err" role="alert"></p>`;
  render(scr({kicker:"Préparation de la partie", title:"Qui sont les loups de Sainte-Cellule ?", body,
    actions: btn("start", "Distribuer les rôles")}), {start: startGame});

  $("#wolves").value = String(settings.wolves);
  $("#timer").value = String(settings.timer);
  $("#answerMode").value = settings.answerMode;
  $("#answerMode").addEventListener("change", e => { settings.answerMode = e.target.value; save(); });
  const save = () => store.set("lg-settings2", settings);
  const refreshCounts = () => {
    const k = readNames().length;
    $("#ncount").innerHTML = `<b>${k}</b> joueur${k > 1 ? "s" : ""}`;
    $("#wolfHint").textContent = settings.wolves === "auto" ? (k >= 5 ? `= ${autoWolves(k)} pour ${k} joueurs` : "") : "";
    const nW = settings.wolves === "auto" ? autoWolves(k) : +settings.wolves;
    const sp = SPECIALS.filter(r => settings[r]).length;
    $("#roleHint").textContent = k >= 5 ? `Avec ${k} joueurs : ${nW} loup${nW > 1 ? "s" : ""}, ${sp} rôle${sp > 1 ? "s" : ""} spécia${sp > 1 ? "ux" : "l"} et ${Math.max(0, k - nW - sp)} villageois.` : "";
  };
  refreshCounts();
  $("#names").addEventListener("input", e => { namesText = e.target.value; store.set("lg-names", namesText); refreshCounts(); });
  const setNames = t => { namesText = t; $("#names").value = t; store.set("lg-names", t); refreshCounts(); };
  const importNames = async file => {
    const info = $("#importInfo");
    info.textContent = "Lecture du fichier…";
    try {
      const names = namesFromRows(await readTable(file));
      if (!names.length) { info.textContent = "Aucun nom trouvé dans ce fichier."; return; }
      setNames(names.join("\n"));
      info.textContent = `${names.length} nom${names.length > 1 ? "s" : ""} importé${names.length > 1 ? "s" : ""} de « ${file.name} ». Vérifiez la liste, puis enregistrez-la comme groupe.`;
      $("#groupSel").value = "";
    } catch (e) { info.textContent = IMPORT_FAIL; }
  };
  $("#namesFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) importNames(f); e.target.value = ""; });
  $("#names").addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); e.target.classList.add("drop"); } });
  $("#names").addEventListener("dragleave", e => e.target.classList.remove("drop"));
  $("#names").addEventListener("drop", e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    e.target.classList.remove("drop");
    if (f) { e.preventDefault(); importNames(f); }
  });
  /* Groupes enregistrés dans ce navigateur */
  let groups = store.get("lg-groups", {});
  const fillGroups = sel => {
    const names = Object.keys(groups).sort((a, b) => a.localeCompare(b, "fr", {numeric:true}));
    $("#groupSel").innerHTML = `<option value="">${names.length ? "Choisir un groupe…" : "Aucun groupe enregistré"}</option>` +
      names.map(g => `<option value="${esc(g)}">${esc(g)} (${groups[g].split("\n").filter(x => x.trim()).length})</option>`).join("");
    $("#groupSel").value = sel || "";
  };
  fillGroups(store.get("lg-group", ""));
  $("#groupSel").addEventListener("change", e => {
    const g = e.target.value; store.set("lg-group", g);
    if (!g) return;
    setNames(groups[g]); $("#groupName").value = g;
    $("#groupInfo").textContent = `Groupe « ${g} » chargé.`;
  });
  $("#groupSave").addEventListener("click", () => {
    const g = $("#groupName").value.trim() || $("#groupSel").value;
    if (!g) { $("#groupInfo").textContent = "Donnez d'abord un nom au groupe (ex. 302)."; $("#groupName").focus(); return; }
    if (!readNames().length) { $("#groupInfo").textContent = "La liste est vide : importez ou écrivez des noms d'abord."; return; }
    groups[g] = namesText; store.set("lg-groups", groups); store.set("lg-group", g); fillGroups(g);
    $("#groupInfo").textContent = `Groupe « ${g} » enregistré dans ce navigateur.`;
  });
  $("#groupDel").addEventListener("click", () => {
    const g = $("#groupSel").value;
    if (!g) { $("#groupInfo").textContent = "Choisissez d'abord le groupe à supprimer."; return; }
    delete groups[g]; store.set("lg-groups", groups); store.set("lg-group", ""); fillGroups("");
    $("#groupInfo").textContent = `Groupe « ${g} » supprimé. La liste affichée n'a pas changé.`;
  });
  $("#numBtn").addEventListener("click", () => {
    const k = Math.min(60, Math.max(5, parseInt($("#numN").value, 10) || 28));
    namesText = Array.from({length:k}, (_, i) => `Joueur ${i + 1}`).join("\n");
    $("#names").value = namesText; store.set("lg-names", namesText); refreshCounts();
  });
  $("#wolves").addEventListener("change", e => { settings.wolves = e.target.value; save(); refreshCounts(); });
  $("#timer").addEventListener("change", e => { settings.timer = +e.target.value; save(); });
  SPECIALS.concat(["qVictim","qVillage","qSeer"]).forEach(id =>
    $("#" + id).addEventListener("change", e => { settings[id] = e.target.checked; save(); refreshCounts(); }));
  $("#injections").value = String(settings.injections);
  $("#injections").addEventListener("change", e => { settings.injections = +e.target.value; save(); });
  const refreshFresh = () => {
    const tot = poolFor(settings.systems).length, f = freshCount(settings.systems);
    $("#freshInfo").textContent = `${f} question${f > 1 ? "s" : ""} jamais posée${f > 1 ? "s" : ""} sur ${tot} pour les systèmes cochés.`;
  };
  refreshFresh();
  $("#resetUsed").addEventListener("click", () => { usedQ.clear(); store.set("lg-used", []); refreshFresh(); });
  stage.querySelectorAll(".sys").forEach(c => c.addEventListener("change", () => {
    settings.systems = [...stage.querySelectorAll(".sys:checked")].map(x => x.value); save(); refreshFresh();
  }));
  const customInfo = () => {
    const r = parseCustom(customText);
    customQs = r.out;
    const cnt = poolFor(["perso"]).length;
    stage.querySelector('[data-sysn="perso"]').textContent = `${cnt} question${cnt > 1 ? "s" : ""}`;
    $("#customInfo").textContent = (r.out.length ? `${r.out.length} question${r.out.length > 1 ? "s" : ""} prête${r.out.length > 1 ? "s" : ""}.` : "") +
      (r.bad.length ? ` Ligne${r.bad.length > 1 ? "s" : ""} ${r.bad.join(", ")} ignorée${r.bad.length > 1 ? "s" : ""} : il faut au moins 5 champs remplis.` : "");
  };
  customInfo();
  $("#custom").addEventListener("input", e => { customText = e.target.value; store.set("lg-custom", customText); customInfo(); });
  $("#customFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const lines = questionsFromRows(await readTable(f));
      if (!lines.length) { $("#customInfo").textContent = "Aucune question trouvée : il faut au moins 5 colonnes remplies par ligne."; return; }
      customText = (customText.trim() ? customText.trim() + "\n" : "") + lines.join("\n");
      $("#custom").value = customText; store.set("lg-custom", customText); customInfo();
      const sys = stage.querySelector('.sys[value="perso"]');
      if (sys && !sys.checked) sys.click();
      $("#customInfo").textContent = `${lines.length} question${lines.length > 1 ? "s" : ""} importée${lines.length > 1 ? "s" : ""} de « ${f.name} ». ` + $("#customInfo").textContent;
    } catch (err) { $("#customInfo").textContent = IMPORT_FAIL; }
  });
}
function startGame(){
  const names = readNames(), n = names.length, err = $("#err");
  const nW = settings.wolves === "auto" ? autoWolves(n) : +settings.wolves;
  const specials = SPECIALS.filter(r => settings[r]).length;
  if (n < 5) return err.textContent = "Il faut au moins 5 joueurs pour commencer.";
  if (nW * 2 >= n) return err.textContent = `Avec ${n} joueurs, il faut moins de ${Math.ceil(n / 2)} loups-garous. Réduisez leur nombre.`;
  if (nW + specials > n) return err.textContent = "Il y a plus de rôles spéciaux que de joueurs.";
  if (!poolFor(settings.systems).length) return err.textContent = "Cochez au moins un système qui contient des questions.";
  newGame(names);
  deal(0);
}

setup();
